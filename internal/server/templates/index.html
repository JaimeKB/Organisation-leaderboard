<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Org Leaderboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Your GitHub Organisations</h1>
  </header>
  <main>
    {{if .Err}}<p class="error">{{.Err}}</p>{{end}}
    {{if and (not .Orgs) (not .Err)}}<p class="muted">No organisations found for this token.</p>{{end}}
    <ul class="org-list">
      {{range .Orgs}}
      <li class="org-card">
        <a href="/org/{{.Login}}">
          <img src="{{.AvatarURL}}" alt="" width="40" height="40" class="avatar">
          <span>{{.Login}}</span>
        </a>
      </li>
      {{end}}
    </ul>
  </main>
</body>
</html>
